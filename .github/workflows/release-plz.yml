name: Release-plz

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # Once CI has passed on a push to main, hand off to a dispatched run on
  # main. Runs started with GITHUB_TOKEN do not trigger other workflows,
  # except dispatches.
  dispatch:
    if: >-
      github.repository == 'paddor/salsabox' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the release run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-plz.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Publish unreleased versions to crates.io via trusted publishing, then
  # open or update the release PR. Only for a main that passed CI.
  release-plz:
    if: >-
      github.repository == 'paddor/salsabox' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check that main passed CI
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if test "$(git rev-parse HEAD)" = "$TESTED_SHA" && test "$TESTED_SHA" = "$latest"; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TESTED_SHA&event=push&status=success" \
              --jq 'if (.workflow_runs | length) > 0 then "tested=true" else "tested=false" end' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.revision.outputs.tested == 'true'
        with:
          toolchain: stable
      - name: Publish merged release
        if: steps.revision.outputs.tested == 'true'
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release PR
        if: steps.revision.outputs.tested == 'true'
        id: release-pr
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release PR comes from GITHUB_TOKEN, so CI does not run on it by
      # itself. Branch protection needs its checks.
      - name: Run CI on the release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr || '{}').head_branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
