name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --no-default-features
      - run: cargo doc --no-deps
      - run: cargo package

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            levels: sse4.2,avx2
          - os: ubuntu-latest
            levels: sse4.2,avx2
            rustflags: -D warnings -C target-cpu=native
          - os: ubuntu-24.04-arm
            levels: neon
          - os: macos-latest
            levels: neon
          - os: windows-latest
            levels: sse4.2,avx2
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '-D warnings' }}
      SALSABOX_REQUIRE_LEVEL: ${{ matrix.levels }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --release --no-default-features

  avx512:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: petarpetrovt/setup-sde@v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - name: Test under Intel SDE (Sapphire Rapids)
        run: cargo test --release --lib
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.SDE_PATH }}/sde64 -spr --
          SALSABOX_REQUIRE_LEVEL: sse4.2,avx2,avx512

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib
      - run: cargo check --lib --no-default-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf
